<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레벨 3D</title>
<style>
  :root { --bg: #16181c; --panel: rgba(28, 31, 37, 0.93); --text: #e8e8e8; --muted: #a8adb5; --line: #3a3f48; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 "Malgun Gothic", system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #ui { position: fixed; top: 10px; left: 10px; width: 250px; max-width: calc(100vw - 40px); max-height: calc(100vh - 40px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  #ui h1 { font-size: 13px; line-height: 1.35; margin: 0; flex: 1; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  button { background: #2b3038; color: var(--text); border: 1px solid #4a515c; border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  .grp { color: var(--muted); font-size: 11px; margin: 7px 0 0; }
  .toggles label { display: flex; align-items: center; gap: 5px; font-size: 12px; cursor: pointer; user-select: none; }
  .toggles input { width: 14px; height: 14px; margin: 0; accent-color: #5c84b8; cursor: pointer; }
  .toggles { gap: 3px 12px; }
  #secs button { background: transparent; border-color: #3a3f48; color: #c9ced6; padding: 2px 7px; font-size: 11px; }
  #secs button::before { content: "› "; color: var(--muted); }
  .legend { display: grid; grid-template-columns: 16px 1fr; gap: 3px 8px; font-size: 11px; color: var(--muted); align-items: center; margin-top: 4px; }
  .head { display: flex; align-items: flex-start; gap: 8px; }
  #bFold { padding: 0 7px; font-size: 14px; line-height: 20px; }
  #ui.folded .body { display: none; }
  details.leg summary { cursor: pointer; color: var(--muted); font-size: 11px; margin-top: 7px; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #000; }
  #tip { position: fixed; pointer-events: none; background: rgba(10, 12, 15, 0.92); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12px; white-space: pre; display: none; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #f0a0a0; }
</style>
</head>
<body>
<div id="view"></div>
<div id="ui">
  <div class="head"><h1 id="title"></h1><button id="bFold" title="패널 접기">–</button></div>
  <div class="body">
  <div class="grp">표시 켜고 끄기</div>
  <div class="row toggles">
    <label><input type="checkbox" id="bWall">벽 반투명</label>
    <label><input type="checkbox" id="bSight">적 시야</label>
    <label><input type="checkbox" id="bLabel" checked>이름표</label>
  </div>
  <div class="grp">카메라</div>
  <div class="row">
    <button id="bHome">전체 보기</button>
    <button id="bTop">위에서 보기</button>
  </div>
  <div class="grp">구간으로 이동</div>
  <div class="row" id="secs"></div>
  <details class="leg"><summary>범례</summary>
  <div class="legend">
    <div class="sw" style="background:linear-gradient(90deg,#4a4b50,#c4c5ca)"></div><div id="floorLegend">바닥 (밝을수록 높음)</div>
    <div class="sw" style="background:#8fa2c4"></div><div>계단·경사로</div>
    <div class="sw" style="background:#e6e4dc"></div><div>벽</div>
    <div class="sw" style="background:#d9963f"></div><div>울타리</div>
    <div class="sw" style="background:#f8cd28"></div><div>성문 (닫힌 상태)</div>
    <div class="sw" style="background:#37c873"></div><div>시작 (플레이어 시작 지점)</div>
    <div class="sw" style="background:#e64b41"></div><div>근 (근거리 일반 적, 절단자)</div>
    <div class="sw" style="background:#f5872a"></div><div>원 (원거리 일반 적, 경비 사수)</div>
    <div class="sw" style="background:#b946e1"></div><div>보스 (커스터)</div>
  </div>
  </details>
  </div>
</div>
<script>
(function () {
  const ui = document.getElementById('ui'), b = document.getElementById('bFold');
  b.onclick = () => { const f = ui.classList.toggle('folded'); b.textContent = f ? '+' : '–'; b.title = f ? '패널 펴기' : '패널 접기'; };
})();
</script>
<div id="tip"></div>
<div id="err">three.js를 불러오지 못했습니다. 인터넷 연결을 확인하세요.</div>

      continue;
    }
    // 캡슐 크기(전체 높이, 반지름 m)는 BP_Boss와 BP_Player·BP_Cutter·BP_Gunner의 캡슐 컴포넌트 값이다.
    const h = a.cls === 'BP_Boss' ? 2.112 : 1.76;
    const r = a.cls === 'BP_Boss' ? 0.408 : 0.34;
    const g = new THREE.CapsuleGeometry(r, h - 2 * r, 6, 16);
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: MCOL[a.mark] }));
    m.position.copy(U(a.x, a.y, a.floor + h * 50));
    const s = a.sight ? `\n시야 ${a.sight[0] / 100}m, 정면 ${a.sight[1]}°` : '';
    m.userData = { tip: `${a.label} (${a.clsName})\n위치 ${(a.x / 100).toFixed(1)}, ${(a.y / 100).toFixed(1)} m, 바닥 ${(a.floor / 100).toFixed(1)} m${s}` };
    scene.add(m); pickables.push(m);
    const yaw = a.yaw * Math.PI / 180;
    const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.6, 10), new THREE.MeshLambertMaterial({ color: 0xffffff }));
    arrow.position.copy(U(a.x + 60 * Math.cos(yaw), a.y + 60 * Math.sin(yaw), a.floor + h * 75));
    arrow.lookAt(U(a.x + 200 * Math.cos(yaw), a.y + 200 * Math.sin(yaw), a.floor + h * 75));
    arrow.rotateX(Math.PI / 2);
    scene.add(arrow);
    const l = makeLabel(a.mark, '#' + MCOL[a.mark].toString(16).padStart(6, '0'), 14);
    l.position.copy(U(a.x, a.y, a.floor + h * 100 + 90)); scene.add(l); labels.push(l);
    if (a.sight) {
      const half = a.sight[1] / 2 * Math.PI / 180;
      const fg = new THREE.CircleGeometry(a.sight[0] / 100, 48, yaw - half, 2 * half);
      fg.rotateX(Math.PI / 2);
      const fan = new THREE.Mesh(fg, new THREE.MeshBasicMaterial({ color: MCOL[a.mark], transparent: true, opacity: 0.06, side: THREE.DoubleSide, depthWrite: false }));
      fan.position.copy(U(a.x, a.y, a.floor + 3));
      fan.visible = false; fan.layers.set(2);
      scene.add(fan); sightObjs.push(fan);
      const arc = [U(a.x, a.y, a.floor + 4)];
      for (let i = 0; i <= 48; i++) { const t = yaw - half + 2 * half * i / 48; arc.push(U(a.x + a.sight[0] * Math.cos(t), a.y + a.sight[0] * Math.sin(t), a.floor + 4)); }
      arc.push(arc[0]);
      const rim = new THREE.Line(new THREE.BufferGeometry().setFromPoints(arc), new THREE.LineBasicMaterial({ color: MCOL[a.mark] }));
      rim.visible = false; rim.layers.set(2);
      scene.add(rim); sightObjs.push(rim);
    }
  }
  for (const s of DATA.sections) {
    const l = makeLabel(s[0], '#ffffff', 15);
    l.position.copy(U(s[1], s[2], s[3] + 1000));
    scene.add(l); labels.push(l);
  }

  // 전체 보기와 위에서 보기는 구조물의 꼭짓점과 이름표가 화면 가운데에 다 들어오게 카메라를 맞춘다.
  // 레벨 경계 상자의 꼭짓점에 맞추면 대각선으로 놓인 레벨에서 빈 모서리까지 넣어 화면이 한쪽으로 쏠린다.
  const points = [];
  pickables.forEach(o => { o.updateMatrixWorld(true); const pa = o.geometry.attributes.position; for (let i = 0; i < pa.count; i++) points.push(new THREE.Vector3().fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld)); });
  labels.forEach(l => points.push(l.position.clone()));
  const bounds = new THREE.Box3().setFromPoints(points);
  function fit(dir, L, T) {
    const R = 0.96, B = -0.92;
    const target = bounds.getCenter(new THREE.Vector3()), right = new THREE.Vector3(), up = new THREE.Vector3(), p = new THREE.Vector3();
    let dist = bounds.getSize(new THREE.Vector3()).length();
    for (let i = 0; i < 10; i++) {
      camera.position.copy(target).addScaledVector(dir, dist);
      camera.lookAt(target);
      camera.updateMatrixWorld();
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const c of points) { p.copy(c).project(camera); x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
      const k = dist * Math.tan(camera.fov * Math.PI / 360);
      right.setFromMatrixColumn(camera.matrixWorld, 0);
      up.setFromMatrixColumn(camera.matrixWorld, 1);
      target.addScaledVector(right, ((x0 + x1) - (L + R)) / 2 * k * camera.aspect).addScaledVector(up, ((y0 + y1) - (T + B)) / 2 * k);
      dist *= Math.max((x1 - x0) / (R - L), (y1 - y0) / (T - B));
    }
    camera.position.copy(target).addScaledVector(dir, dist);
    camera.lookAt(target);
    camera.updateMatrixWorld();
    controls.target.copy(target);
  }
  function panelOverlap(r) {
    const W = window.innerWidth, H = window.innerHeight, p = new THREE.Vector3();
    return points.some(c => { p.copy(c).project(camera); return (p.x + 1) / 2 * W < r.right + 8 && (1 - p.y) / 2 * H < r.bottom + 8; });
  }
  function frame(dir) {
    // 왼쪽 위 패널은 레벨과 겹칠 때만 피한다. 패널 폭만큼 오른쪽으로, 또는 패널 높이만큼 아래로 비키는 것 중 레벨이 더 크게 보이는 쪽을 쓴다.
    const ui = document.getElementById('ui'), r = ui.getBoundingClientRect(), W = window.innerWidth, H = window.innerHeight;
    fit(dir, -0.96, 0.92);
    if (!panelOverlap(r)) { controls.update(); return; }
    const opts = [];
    if (r.right < W * 0.6) opts.push([-1 + 2 * (r.right + 12) / W, 0.92]);
    if (r.bottom < H * 0.6) opts.push([-0.96, 1 - 2 * (r.bottom + 12) / H]);
    let best = null;
    for (const [L, T] of opts) { fit(dir, L, T); const d = camera.position.distanceTo(controls.target); if (!best || d < best.d) best = { L, T, d }; }
    if (best) fit(dir, best.L, best.T);
    controls.update();
  }
  const homeDir = new THREE.Vector3(-70, 95, 110).normalize(), topDir = new THREE.Vector3(0, 1, 0.0001).normalize();
  const home = () => frame(homeDir);
  home();
  const secs = document.getElementById('secs');
  for (const s of DATA.sections) {
    const btn = document.createElement('button');
    btn.textContent = s[0];
    btn.onclick = () => { const t = U(s[1], s[2], s[3]); camera.position.set(t.x - 24, t.y + 28, t.z + 28); controls.target.copy(t); controls.update(); };
    secs.appendChild(btn);
  }
  document.getElementById('bHome').onclick = home;
  document.getElementById('bTop').onclick = () => frame(topDir);
  function toggle(id, fn) { const b = document.getElementById(id); b.onchange = () => fn(b.checked); }
  let wallsClear = false;
  toggle('bWall', on => { wallsClear = on; walls.forEach(w => { const m = w.mesh.material; m.transparent = on; m.opacity = on ? 0.22 : 1; m.depthWrite = !on; m.needsUpdate = true; w.edge.visible = on; }); });
  toggle('bSight', on => sightObjs.forEach(o => { o.visible = on; }));
  toggle('bLabel', on => labels.forEach(o => { o.visible = on; }));

  const tip = document.getElementById('tip');
  const ray = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  renderer.domElement.addEventListener('mousemove', ev => {
    mouse.x = ev.clientX / window.innerWidth * 2 - 1;
    mouse.y = -ev.clientY / window.innerHeight * 2 + 1;
    ray.setFromCamera(mouse, camera);
    const hit = ray.intersectObjects(pickables.filter(o => o.visible && !(o.material.transparent && o.material.opacity < 1)))[0];
    if (hit) { tip.textContent = hit.object.userData.tip; tip.style.display = 'block'; tip.style.left = (ev.clientX + 14) + 'px'; tip.style.top = (ev.clientY + 14) + 'px'; }
    else tip.style.display = 'none';
  });
  // 이름표는 거리와 관계없이 화면에서 같은 픽셀 크기로 그린다(sizeAttenuation을 끄면 크기가 화면 높이 비율이 된다).
  function sizeLabels() {
    const k = 2 * Math.tan(camera.fov * Math.PI / 360) / window.innerHeight;
    screenLabels.forEach(s => s.scale.set(s.userData.px * k * s.userData.ratio, s.userData.px * k, 1));
  }
  sizeLabels();

  // 화면 윤곽선: 물체를 면 방향 색으로 한 번 더 그려 두고, 이웃 픽셀과 면 방향이나 깊이가 끊기는 곳을 검게 덧칠한다.
  // 깊이는 버퍼 값(1/거리에 비례)을 그대로 두 번 차분한다. 평면 위에서는 0이라 비스듬히 보는 바닥에 선이 생기지 않는다.
  const edgeRT = new THREE.WebGLRenderTarget(1, 1, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
  edgeRT.depthTexture = new THREE.DepthTexture(1, 1);
  const normalMat = new THREE.MeshNormalMaterial({ side: THREE.DoubleSide });
  const edgeQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
    uniforms: { tNormal: { value: edgeRT.texture }, tDepth: { value: edgeRT.depthTexture }, px: { value: new THREE.Vector2() } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: `
      uniform sampler2D tNormal; uniform sampler2D tDepth; uniform vec2 px; varying vec2 vUv;
      float inv(vec2 uv) { return 1.0 - texture2D(tDepth, uv).x; }
      vec3 nrm(vec2 uv) { return normalize(texture2D(tNormal, uv).xyz * 2.0 - 1.0); }
      float edge(vec2 uv) {
        vec2 dx = vec2(px.x, 0.0), dy = vec2(0.0, px.y);
        float c = inv(uv); vec3 n = nrm(uv);
        float bend = abs(inv(uv + dx) + inv(uv - dx) - 2.0 * c) + abs(inv(uv + dy) + inv(uv - dy) - 2.0 * c);
        float turn = 1.0 - min(min(dot(n, nrm(uv + dx)), dot(n, nrm(uv - dx))), min(dot(n, nrm(uv + dy)), dot(n, nrm(uv - dy))));
        return max(smoothstep(0.004, 0.012, bend / max(c, 1e-6)), smoothstep(0.03, 0.08, turn));
      }
      void main() {
        vec2 h = 0.5 * px;
        float e = 0.25 * (edge(vUv + h) + edge(vUv - h) + edge(vUv + vec2(h.x, -h.y)) + edge(vUv + vec2(-h.x, h.y)));
        gl_FragColor = vec4(0.0, 0.0, 0.0, 0.6 * e);
      }`,
    transparent: true, depthTest: false, depthWrite: false }));
  edgeQuad.frustumCulled = false;
  const edgeScene = new THREE.Scene(), edgeCam = new THREE.Camera();
  edgeScene.add(edgeQuad);
  function sizeEdges() {
    // 선이 매끄럽게 나오도록 화면의 두 배로 그려 네 점을 평균한다. 픽셀이 촘촘한 화면에서는 그대로 쓴다.
    const s = renderer.getDrawingBufferSize(new THREE.Vector2()).multiplyScalar(renderer.getPixelRatio() > 1 ? 1 : 2);
    s.max(new THREE.Vector2(1, 1));
    edgeRT.setSize(s.x, s.y);
    edgeQuad.material.uniforms.px.value.set(1 / s.x, 1 / s.y);
  }
  sizeEdges();
  renderer.autoClear = false;
  function draw() {
    walls.forEach(w => { w.mesh.visible = !wallsClear; });
    camera.layers.set(0);
    scene.overrideMaterial = normalMat;
    renderer.setRenderTarget(edgeRT); renderer.clear(); renderer.render(scene, camera);
    scene.overrideMaterial = null;
    walls.forEach(w => { w.mesh.visible = true; });
    renderer.setRenderTarget(null); renderer.clear();
    camera.layers.enable(2); renderer.render(scene, camera);
    renderer.render(edgeScene, edgeCam);
    camera.layers.set(1); renderer.render(scene, camera);
    camera.layers.set(0);
  }
  window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); sizeLabels(); sizeEdges(); });
  (function loop() { requestAnimationFrame(loop); controls.update(); draw(); })();
})();
</script>
</body>
</html>
