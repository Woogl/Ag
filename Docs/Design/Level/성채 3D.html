<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성채 3D</title>
<style>
  :root { --bg: #16181c; --panel: rgba(28, 31, 37, 0.93); --text: #e8e8e8; --muted: #a8adb5; --line: #3a3f48; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 "Malgun Gothic", system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #ui { position: fixed; top: 10px; left: 10px; width: 270px; max-width: calc(100vw - 40px); max-height: calc(100vh - 40px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  #ui h1 { font-size: 13px; line-height: 1.35; margin: 0; flex: 1; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  button { background: #2b3038; color: var(--text); border: 1px solid #4a515c; border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  .grp { color: var(--muted); font-size: 11px; margin: 7px 0 0; }
  .toggles label { display: flex; align-items: center; gap: 5px; font-size: 12px; cursor: pointer; user-select: none; }
  .toggles input { width: 14px; height: 14px; margin: 0; accent-color: #5c84b8; cursor: pointer; }
  .toggles { gap: 3px 12px; }
  #secs button { background: transparent; border-color: #3a3f48; color: #c9ced6; padding: 2px 7px; font-size: 11px; }
  #secs button::before { content: "› "; color: var(--muted); }
  .legend { display: grid; grid-template-columns: 16px 1fr; gap: 3px 8px; font-size: 11px; color: var(--muted); align-items: center; margin-top: 4px; }
  .head { display: flex; align-items: flex-start; gap: 8px; }
  #bFold { padding: 0 7px; font-size: 14px; line-height: 20px; }
  #ui.folded .body { display: none; }
  details.leg summary { cursor: pointer; color: var(--muted); font-size: 11px; margin-top: 7px; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #000; }
  .clip { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .clip input { flex: 1; accent-color: #5c84b8; }
  .clip span { width: 54px; text-align: right; color: var(--muted); font-size: 11px; }
  #routes label { display: flex; align-items: center; gap: 5px; font-size: 12px; cursor: pointer; user-select: none; width: 100%; }
  #routes input { width: 14px; height: 14px; margin: 0; cursor: pointer; }
  #routes i { width: 18px; height: 4px; border-radius: 2px; display: inline-block; }
  #tip { position: fixed; pointer-events: none; background: rgba(10, 12, 15, 0.92); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12px; white-space: pre; display: none; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #f0a0a0; }
</style>
</head>
<body>
<div id="view"></div>
<div id="ui">
  <div class="head"><h1 id="title"></h1><button id="bFold" title="패널 접기">–</button></div>
  <div class="body">
  <div class="grp">표시 켜고 끄기</div>
  <div class="row toggles">
    <label><input type="checkbox" id="bWall" checked>벽·지붕 반투명</label>
    <label><input type="checkbox" id="bPatrol" checked>정찰 경로</label>
    <label><input type="checkbox" id="bSight">적 시야</label>
    <label><input type="checkbox" id="bLabel" checked>이름표</label>
  </div>
  <div class="grp">동선</div>
  <div class="row" id="routes"></div>
  <div class="grp">단면 높이 (이 높이 위를 잘라 냄)</div>
  <div class="clip"><input type="range" id="clip" min="-1" max="46" step="0.5" value="46"><span id="clipVal">끔</span></div>
  <div class="grp">카메라</div>
  <div class="row">
    <button id="bHome">전체 보기</button>
    <button id="bTop">위에서 보기</button>
  </div>
  <div class="grp">구간으로 이동</div>
  <div class="row" id="secs"></div>
  <details class="leg"><summary>범례</summary>
  <div class="legend">
    <div class="sw" style="background:linear-gradient(90deg,#46464a,#c4c5ca)"></div><div>바닥 (밝을수록 높음, 0m ~ 44m)</div>
    <div class="sw" style="background:#b79f7a"></div><div>계단</div>
    <div class="sw" style="background:#66789e"></div><div>점프로 오르는 발판 (상자, 지붕)</div>
    <div class="sw" style="background:#9a6a3c"></div><div>다리, 발코니, 절벽 턱</div>
    <div class="sw" style="background:#e6e4dc"></div><div>벽, 난간, 탑, 지붕</div>
    <div class="sw" style="background:#d9963f"></div><div>장애물 (엄폐물, 기둥)</div>
    <div class="sw" style="background:#f8cd28"></div><div>성문 (닫힌 상태). 마우스를 올리면 여는 쪽이 나옵니다.</div>
    <div class="sw" style="background:#37c873"></div><div>P 플레이어 시작</div>
    <div class="sw" style="background:#e64b41"></div><div>근 근거리 일반 적 (절단자)</div>
    <div class="sw" style="background:#f5872a"></div><div>원 원거리 일반 적 (경비 사수)</div>
    <div class="sw" style="background:#b946e1"></div><div>B 보스 (커스터)</div>
  </div>
  </details>
  </div>
</div>
<script>
(function () {
  const ui = document.getElementById('ui'), b = document.getElementById('bFold');
  b.onclick = () => { const f = ui.classList.toggle('folded'); b.textContent = f ? '+' : '–'; b.title = f ? '패널 펴기' : '패널 접기'; };
})();
</script>
<div id="tip"></div>
<div id="err">three.js를 불러오지 못했습니다. 인터넷 연결을 확인하세요.</div>

  sun.position.set(-60, 120, -40);

  // 단면: 이 높이 위는 그리지 않는다. 지하와 건물 안을 들여다볼 때 쓴다.
  // 상자와 원기둥은 윗면을 단면 높이까지 낮춰 속이 찬 채로 잘리게 하고, 나머지(계단, 선, 캐릭터, 이름표)는 자르는 평면을 쓴다.
  const CLIP_MAX = 46;
  const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e6);
  renderer.localClippingEnabled = true;
  let clipH = CLIP_MAX;
  const clipObjs = [];

  const KNAME = { floor: '바닥', abyss: '낭떠러지 아래', plat: '점프 발판', wall: '벽', roof: '지붕', obstacle: '장애물', bridge: '다리·턱', stair: '계단' };
  const ZMIN = 0, ZSPAN = 4400;
  function floorColor(z) {
    const t = Math.max(0, Math.min(1, (z - ZMIN) / ZSPAN));
    const v = (70 + 120 * t) / 255;
    return new THREE.Color(v, v, v * 1.02);
  }
  function colorOf(kind, top) {
    if (kind === 'floor') return floorColor(top);
    return new THREE.Color({ abyss: 0x24262b, wall: 0xe6e4dc, roof: 0xe6e4dc, plat: 0x66789e, obstacle: 0xd9963f, bridge: 0x9a6a3c, stair: 0xb79f7a }[kind]);
  }
  const m2 = v => (v / 100).toFixed(2);

  const pickables = [], fadeMats = [], labels = [], nearLabels = [], sightObjs = [], patrolObjs = [];
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 });
  const outlineMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22 });
  function addMesh(g, kind, top, tipText, pos, rot, edges) {
    const mat = new THREE.MeshLambertMaterial({ color: colorOf(kind, top), side: THREE.DoubleSide });
    const m = new THREE.Mesh(g, mat);
    m.position.copy(pos);
    if (rot) m.rotation.copy(rot);
    m.userData = { tip: tipText };
    scene.add(m);
    let e = null;
    if (edges !== false) {
      e = new THREE.LineSegments(new THREE.EdgesGeometry(g, 20), edgeMat);
      e.position.copy(m.position); e.rotation.copy(m.rotation);
      scene.add(e);
    }
    pickables.push(m);
    if (kind === 'wall' || kind === 'roof') fadeMats.push(mat);
    return [m, e];
  }
  function addSolid(g, kind, z0, z1, tipText, pos, edges) {
    const [m, e] = addMesh(g, kind, z1, tipText, pos, null, edges);
    clipObjs.push({ m, e, z0: z0 / 100, z1: z1 / 100 });
  }
  const outlined = new Set();
  for (const b of DATA.boxes) {
    const [x0, x1, y0, y1, z0, z1] = b.e, f = b.full;
    const g = new THREE.BoxGeometry((x1 - x0) / 100, (z1 - z0) / 100, (y1 - y0) / 100);
    const tip = `${b.name} (${KNAME[b.kind]})\n크기 ${m2(f[1] - f[0])} × ${m2(f[3] - f[2])} × ${m2(f[5] - f[4])} m\n윗면 높이 ${m2(f[5])} m`;
    // 빼기 브러시에 잘린 바닥 덩어리는 조각마다 모서리선을 그리면 윗면에 없는 금이 생긴다. 원래 상자의 테두리만 한 번 그린다.
    const mass = b.cut && (b.kind === 'floor' || b.kind === 'abyss');
    addSolid(g, b.kind, z0, z1, tip, U((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2), !mass);
    if (mass && !outlined.has(b.name)) {
      outlined.add(b.name);
      const og = new THREE.BoxGeometry((f[1] - f[0]) / 100, (f[5] - f[4]) / 100, (f[3] - f[2]) / 100);
      const o = new THREE.LineSegments(new THREE.EdgesGeometry(og), outlineMat);
      o.position.copy(U((f[0] + f[1]) / 2, (f[2] + f[3]) / 2, (f[4] + f[5]) / 2));
      scene.add(o);
    }
  }
  for (const r of DATA.cyls) {
    const g = new THREE.CylinderGeometry(r.r / 100, r.r / 100, (r.z1 - r.z0) / 100, 28);
    addSolid(g, r.kind, r.z0, r.z1, `${r.name} (${KNAME[r.kind]})\n반지름 ${m2(r.r)} m\n윗면 높이 ${m2(r.z1)} m`, U(r.c[0], r.c[1], (r.z0 + r.z1) / 2));
  }
  // 계단: 옆에서 본 단 모양을 폭만큼 밀어 낸다. 지역 좌표는 x = 오르는 방향, y = 위, z = 폭이다.
  for (const s of DATA.stairs) {
    const [x0, x1, y0, y1] = s.rect, n = s.steps, run = s.run / 100, rise = s.rise / 100;
    const along = (s.dir === '+x' || s.dir === '-x') ? (x1 - x0) / 100 : (y1 - y0) / 100;
    const width = (s.dir === '+x' || s.dir === '-x') ? (y1 - y0) / 100 : (x1 - x0) / 100;
    const sh = new THREE.Shape();
    sh.moveTo(0, 0);
    for (let i = 0; i < n; i++) { sh.lineTo(i * run, (i + 1) * rise); sh.lineTo((i + 1) * run, (i + 1) * rise); }
    sh.lineTo(along, 0);
    sh.closePath();
    const g = new THREE.ExtrudeGeometry(sh, { depth: width, bevelEnabled: false });
    const P = { '+x': [U(x0, y0, s.z0), 0], '-x': [U(x1, y1, s.z0), Math.PI], '+y': [U(x1, y0, s.z0), -Math.PI / 2], '-y': [U(x0, y1, s.z0), Math.PI / 2] }[s.dir];
    const DN = { '+x': '+X', '-x': '-X', '+y': '+Y', '-y': '-Y' }[s.dir];
    addMesh(g, 'stair', s.z1, `${s.name} (계단)\n${DN} 쪽으로 오름, ${n}단 (단 높이 ${m2(s.rise)} m, 단 깊이 ${run.toFixed(2)} m)\n폭 ${width.toFixed(2)} m, 높이 ${m2(s.z0)} → ${m2(s.z1)} m`, P[0], new THREE.Euler(0, P[1], 0));
  }

  const screenLabels = [];
  function makeLabel(text, color, px) {
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    const fs = 44;
    ctx.font = `bold ${fs}px "Malgun Gothic", sans-serif`;
    const w = Math.ceil(ctx.measureText(text).width) + 24;
    c.width = w; c.height = fs + 20;
    ctx.font = `bold ${fs}px "Malgun Gothic", sans-serif`;
    ctx.fillStyle = 'rgba(15,17,20,0.78)';
    ctx.fillRect(0, 0, w, c.height);
    ctx.fillStyle = color;
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 12, c.height / 2);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, sizeAttenuation: false }));
    sp.userData.px = px;
    sp.userData.ratio = w / c.height;
    screenLabels.push(sp);
    sp.renderOrder = 10;
    return sp;
  }

  // 동선: 구간을 잇는 꺾은선. 바닥에서 1.2m 위에 그린다.
  const routeBox = document.getElementById('routes');
  for (const [name, color, pts] of DATA.routes) {
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts.map(p => U(p[0], p[1], p[2] + 120))), new THREE.LineBasicMaterial({ color: new THREE.Color(color) }));
    scene.add(line);
    const l = makeLabel(name, color, 13);
    l.position.copy(U(pts[0][0], pts[0][1], pts[0][2] + 330));
    scene.add(l);
    const lab = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true; cb.style.accentColor = color;
    const sw = document.createElement('i');
    sw.style.background = color;
    lab.appendChild(cb); lab.appendChild(sw); lab.appendChild(document.createTextNode(name));
    routeBox.appendChild(lab);
    cb.onchange = () => { line.visible = cb.checked; l.userData.off = !cb.checked; l.visible = cb.checked; };
  }
  // 정찰 경로: 지점을 순서대로 잇고 마지막 지점에서 첫 지점으로 돌아간다.
  for (const p of DATA.patrols) {
    const pts = p.pts.map(q => U(q[0], q[1], p.floor + 25));
    if (pts.length > 2) pts.push(pts[0]);
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({ color: 0xe64b41, dashSize: 0.8, gapSize: 0.5 }));
    line.computeLineDistances();
    scene.add(line); patrolObjs.push(line);
    for (const q of p.pts) {
      const d = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 8), new THREE.MeshBasicMaterial({ color: 0xe64b41 }));
      d.position.copy(U(q[0], q[1], p.floor + 25));
      scene.add(d); patrolObjs.push(d);
    }
  }

  const MCOL = { P: 0x37c873, '근': 0xe64b41, '원': 0xf5872a, B: 0xb946e1 };
  for (const a of DATA.actors) {
    if (a.cls === 'BP_Gate') {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.3, 5, 5), new THREE.MeshLambertMaterial({ color: 0xf8cd28 }));
      m.position.copy(U(a.x, a.y, a.floor + 250));
      m.rotation.y = -a.yaw * Math.PI / 180;
      m.userData = { tip: `${a.label} (성문, 닫힌 상태)\n폭 5m, 높이 5m, 바닥 ${m2(a.floor)} m\n${a.note}` };
      scene.add(m); pickables.push(m);
      // 여는 쪽(성문의 -X 쪽)을 가리키는 작은 화살표
      const yaw = a.yaw * Math.PI / 180;
      const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.9, 10), new THREE.MeshLambertMaterial({ color: 0xf8cd28 }));
      arrow.position.copy(U(a.x - 220 * Math.cos(yaw), a.y - 220 * Math.sin(yaw), a.floor + 120));
      arrow.lookAt(U(a.x, a.y, a.floor + 120));
      arrow.rotateX(Math.PI / 2);
      scene.add(arrow);
      const l = makeLabel('성문', '#f8cd28', 14); l.position.copy(U(a.x, a.y, a.floor + 620)); scene.add(l); labels.push(l);
      continue;
    }
    // 캡슐 크기(전체 높이, 반지름 m)는 BP_Boss와 BP_Player·BP_Cutter·BP_Gunner의 캡슐 컴포넌트 값이다.
    const h = a.cls === 'BP_Boss' ? 2.112 : 1.76;
    const r = a.cls === 'BP_Boss' ? 0.408 : 0.34;
    const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, h - 2 * r, 6, 16), new THREE.MeshLambertMaterial({ color: MCOL[a.mark] }));
    m.position.copy(U(a.x, a.y, a.floor + h * 50));
    const s = a.sight ? `\n시야 ${a.sight[0] / 100}m, 정면 ${a.sight[1]}°` : '';
    const pt = a.patrol ? `\n정찰 ${a.patrol}` : '';
    m.userData = { tip: `${a.label} (${a.clsName})\n위치 ${(a.x / 100).toFixed(1)}, ${(a.y / 100).toFixed(1)} m, 바닥 ${(a.floor / 100).toFixed(1)} m${s}${pt}` };
    scene.add(m); pickables.push(m);
    const yaw = a.yaw * Math.PI / 180;
    const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.6, 10), new THREE.MeshLambertMaterial({ color: 0xffffff }));
    arrow.position.copy(U(a.x + 60 * Math.cos(yaw), a.y + 60 * Math.sin(yaw), a.floor + h * 75));
    arrow.lookAt(U(a.x + 200 * Math.cos(yaw), a.y + 200 * Math.sin(yaw), a.floor + h * 75));
    arrow.rotateX(Math.PI / 2);
    scene.add(arrow);
    const l = makeLabel(a.mark, '#' + MCOL[a.mark].toString(16).padStart(6, '0'), 13);
    l.position.copy(U(a.x, a.y, a.floor + h * 100 + 90)); scene.add(l);
    if (a.mark === 'P' || a.mark === 'B') labels.push(l); else nearLabels.push(l);
    if (a.sight) {
      const half = a.sight[1] / 2 * Math.PI / 180;
      const fg = new THREE.CircleGeometry(a.sight[0] / 100, 48, yaw - half, 2 * half);
      fg.rotateX(Math.PI / 2);
      const fan = new THREE.Mesh(fg, new THREE.MeshBasicMaterial({ color: MCOL[a.mark], transparent: true, opacity: 0.06, side: THREE.DoubleSide, depthWrite: false }));
      fan.position.copy(U(a.x, a.y, a.floor + 3));
      fan.visible = false;
      scene.add(fan); sightObjs.push(fan);
      const arc = [U(a.x, a.y, a.floor + 4)];
      for (let i = 0; i <= 48; i++) { const t = yaw - half + 2 * half * i / 48; arc.push(U(a.x + a.sight[0] * Math.cos(t), a.y + a.sight[0] * Math.sin(t), a.floor + 4)); }
      arc.push(arc[0]);
      const rim = new THREE.Line(new THREE.BufferGeometry().setFromPoints(arc), new THREE.LineBasicMaterial({ color: MCOL[a.mark] }));
      rim.visible = false;
      scene.add(rim); sightObjs.push(rim);
    }
  }
  for (const s of DATA.sections) {
    const l = makeLabel(s[0], '#ffffff', 14);
    l.position.copy(U(s[1], s[2], s[3] + 700));
    scene.add(l); labels.push(l);
  }

  // 전체 보기와 위에서 보기는 구조물의 꼭짓점과 이름표가 화면 가운데에 다 들어오게 카메라를 맞춘다.
  const points = [];
  pickables.forEach(o => { if (o.userData.tip.startsWith('Abyss_Floor')) return; o.updateMatrixWorld(true); const pa = o.geometry.attributes.position; for (let i = 0; i < pa.count; i += 3) points.push(new THREE.Vector3().fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld)); });
  labels.forEach(l => points.push(l.position.clone()));
  const bounds = new THREE.Box3().setFromPoints(points);
  function fit(dir, L, T) {
    const R = 0.96, B = -0.92;
    const target = bounds.getCenter(new THREE.Vector3()), right = new THREE.Vector3(), up = new THREE.Vector3(), p = new THREE.Vector3();
    let dist = bounds.getSize(new THREE.Vector3()).length();
    for (let i = 0; i < 10; i++) {
      camera.position.copy(target).addScaledVector(dir, dist);
      camera.lookAt(target);
      camera.updateMatrixWorld();
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const c of points) { p.copy(c).project(camera); x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
      const k = dist * Math.tan(camera.fov * Math.PI / 360);
      right.setFromMatrixColumn(camera.matrixWorld, 0);
      up.setFromMatrixColumn(camera.matrixWorld, 1);
      target.addScaledVector(right, ((x0 + x1) - (L + R)) / 2 * k * camera.aspect).addScaledVector(up, ((y0 + y1) - (T + B)) / 2 * k);
      dist *= Math.max((x1 - x0) / (R - L), (y1 - y0) / (T - B));
    }
    camera.position.copy(target).addScaledVector(dir, dist);
    camera.lookAt(target);
    camera.updateMatrixWorld();
    controls.target.copy(target);
  }
  function panelOverlap(r) {
    const W = window.innerWidth, H = window.innerHeight, p = new THREE.Vector3();
    return points.some(c => { p.copy(c).project(camera); return (p.x + 1) / 2 * W < r.right + 8 && (1 - p.y) / 2 * H < r.bottom + 8; });
  }
  function frame(dir) {
    // 왼쪽 위 패널은 레벨과 겹칠 때만 피한다. 패널 폭만큼 오른쪽으로, 또는 패널 높이만큼 아래로 비키는 것 중 레벨이 더 크게 보이는 쪽을 쓴다.
    const ui = document.getElementById('ui'), r = ui.getBoundingClientRect(), W = window.innerWidth, H = window.innerHeight;
    fit(dir, -0.96, 0.92);
    if (!panelOverlap(r)) { controls.update(); return; }
    const opts = [];
    if (r.right < W * 0.6) opts.push([-1 + 2 * (r.right + 12) / W, 0.92]);
    if (r.bottom < H * 0.6) opts.push([-0.96, 1 - 2 * (r.bottom + 12) / H]);
    let best = null;
    for (const [L, T] of opts) { fit(dir, L, T); const d = camera.position.distanceTo(controls.target); if (!best || d < best.d) best = { L, T, d }; }
    if (best) fit(dir, best.L, best.T);
    controls.update();
  }
  const clipIn = document.getElementById('clip'), clipVal = document.getElementById('clipVal');
  const solidMats = new Set(clipObjs.map(o => o.m.material));
  scene.traverse(o => { if (o.material && !solidMats.has(o.material)) o.material.clippingPlanes = [clipPlane]; });
  function setClip(h) {
    const off = h >= CLIP_MAX;
    clipH = off ? 1e6 : h;
    clipIn.value = h;
    clipPlane.constant = clipH;
    for (const o of clipObjs) {
      const top = Math.min(o.z1, clipH), vis = top > o.z0 + 1e-6, k = vis ? (top - o.z0) / (o.z1 - o.z0) : 1, y = vis ? (o.z0 + top) / 2 : 0;
      for (const t of [o.m, o.e]) { if (!t) continue; t.visible = vis; t.scale.y = k; t.position.y = y; }
    }
    clipVal.textContent = off ? '끔' : h.toFixed(1) + ' m';
  }
  clipIn.oninput = () => setClip(parseFloat(clipIn.value));
  // 시작 지점(남서쪽 아래)에서 성채를 올려다보는 쪽이 기본 방향이다.
  const homeDir = new THREE.Vector3(-0.35, 0.6, 0.72).normalize(), topDir = new THREE.Vector3(0, 1, 0.0001).normalize();
  const home = () => { setClip(CLIP_MAX); frame(homeDir); };
  home();
  const secs = document.getElementById('secs');
  for (const s of DATA.sections) {
    const btn = document.createElement('button');
    btn.textContent = s[0];
    btn.onclick = () => { setClip(s[4] === null ? CLIP_MAX : s[4] / 100); const t = U(s[1], s[2], s[3]); camera.position.set(t.x - 22, t.y + 26, t.z + 30); controls.target.copy(t); controls.update(); };
    secs.appendChild(btn);
  }
  document.getElementById('bHome').onclick = home;
  document.getElementById('bTop').onclick = () => frame(topDir);
  function setFade(on) { fadeMats.forEach(m => { m.transparent = on; m.opacity = on ? 0.2 : 1; m.depthWrite = !on; m.needsUpdate = true; }); }
  setFade(true);
  let labelOn = true;
  function toggle(id, fn) { const b = document.getElementById(id); b.onchange = () => fn(b.checked); }
  toggle('bWall', setFade);
  toggle('bPatrol', on => patrolObjs.forEach(o => { o.visible = on; }));
  toggle('bSight', on => sightObjs.forEach(o => { o.visible = on; }));
  toggle('bLabel', on => { labelOn = on; labels.forEach(o => { o.visible = on; }); });

  const tip = document.getElementById('tip');
  const ray = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  renderer.domElement.addEventListener('mousemove', ev => {
    mouse.x = ev.clientX / window.innerWidth * 2 - 1;
    mouse.y = -ev.clientY / window.innerHeight * 2 + 1;
    ray.setFromCamera(mouse, camera);
    // 반투명한 벽과 단면에 잘려 안 보이는 곳은 집지 않는다.
    const hit = ray.intersectObjects(pickables.filter(o => o.visible && !(o.material.transparent && o.material.opacity < 1))).find(h => h.point.y <= clipH + 0.01);
    // (상자는 단면 높이까지만 남아 있으므로 걸러지는 것은 계단과 캐릭터뿐이다.)
    if (hit) { tip.textContent = hit.object.userData.tip; tip.style.display = 'block'; tip.style.left = (ev.clientX + 14) + 'px'; tip.style.top = (ev.clientY + 14) + 'px'; }
    else tip.style.display = 'none';
  });
  // 이름표는 거리와 관계없이 화면에서 같은 픽셀 크기로 그린다(sizeAttenuation을 끄면 크기가 화면 높이 비율이 된다).
  function sizeLabels() {
    const k = 2 * Math.tan(camera.fov * Math.PI / 360) / window.innerHeight;
    screenLabels.forEach(s => s.scale.set(s.userData.px * k * s.userData.ratio, s.userData.px * k, 1));
  }
  sizeLabels();
  window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); sizeLabels(); });
  // 적 기호는 카메라가 가까울 때만 보인다. 멀리서 모두 보이면 서로 겹친다.
  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    nearLabels.forEach(l => { l.visible = labelOn && camera.position.distanceTo(l.position) < 90; });
    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
