<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#2c3644"/>
      <stop offset="1" stop-color="#11151b"/>
    </radialGradient>
  </defs>

  <!-- 배경: 뒤에 보이는 LV_FrontEnd 레벨 (임시 표현) -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 화면 여백 48px -->
  <rect x="48" y="48" width="1824" height="984" fill="none" stroke="#9aa4b1" stroke-width="2" stroke-dasharray="12 10" opacity="0.4"/>
  <text x="56" y="34" font-size="16" fill="#9aa4b1">타이틀 화면 (LV_FrontEnd) · 기준 해상도 1920 × 1080 · 저장된 슬롯과 빈 슬롯이 모두 있을 때</text>

  <!-- 게임 제목 -->
  <text x="960" y="370" font-size="224" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="24">AG</text>

  <!-- 버튼 (세로 배치) -->
  <g font-size="32" font-weight="700" text-anchor="middle">
    <rect x="780" y="500" width="360" height="72" rx="8" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="3"/>
    <text x="960" y="547" fill="#FFFFFF">Continue</text>

    <rect x="780" y="596" width="360" height="72" rx="8" fill="#000000" fill-opacity="0.3" stroke="#9aa4b1" stroke-width="1.5"/>
    <text x="960" y="643" fill="#c9d1db">New Game</text>

    <rect x="780" y="692" width="360" height="72" rx="8" fill="#000000" fill-opacity="0.3" stroke="#9aa4b1" stroke-width="1.5"/>
    <text x="960" y="739" fill="#c9d1db">Load Game</text>

    <rect x="780" y="788" width="360" height="72" rx="8" fill="#000000" fill-opacity="0.3" stroke="#9aa4b1" stroke-width="1.5"/>
    <text x="960" y="835" fill="#c9d1db">Settings</text>

    <rect x="780" y="884" width="360" height="72" rx="8" fill="#000000" fill-opacity="0.3" stroke="#9aa4b1" stroke-width="1.5"/>
    <text x="960" y="931" fill="#c9d1db">Quit</text>
  </g>
  <text x="1160" y="542" font-size="16" fill="#9aa4b1">← 처음 선택된 버튼 (표시된 버튼 중 맨 위)</text>

  <!-- 표시 조건 (참고용, 화면에 표시하지 않음) -->
  <g font-size="16" fill="#9aa4b1">
    <text x="1160" y="638">← 빈 슬롯이 없으면 표시하지 않음</text>
    <text x="1160" y="734">← 저장된 슬롯이 없으면 Continue와 함께 표시하지 않음</text>
    <text x="330" y="638">표시하지 않는 버튼의 자리는 비우지 않고</text>
    <text x="330" y="662">남은 버튼을 위에서부터 채움</text>
  </g>

  <!-- UI 조작 안내 (참고용, 화면에 표시하지 않음) -->
  <text x="960" y="1008" font-size="18" fill="#9aa4b1" text-anchor="middle">(참고) 선택: 마우스 이동, ↑·↓ / 실행: 좌클릭, Enter</text>
</svg>
