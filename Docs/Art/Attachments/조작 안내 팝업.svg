<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#2c3644"/>
      <stop offset="1" stop-color="#11151b"/>
    </radialGradient>
  </defs>

  <!-- 배경 (임시) -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 화면 여백 48px -->
  <rect x="48" y="48" width="1824" height="984" fill="none" stroke="#9aa4b1" stroke-width="2" stroke-dasharray="12 10" opacity="0.4"/>
  <text x="56" y="34" font-size="16" fill="#9aa4b1">타이틀 화면 (LV_FrontEnd) · 기준 해상도 1920 × 1080</text>

  <!-- 게임 제목 -->
  <text x="960" y="430" font-size="224" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="24">AG</text>

  <!-- 버튼 (세로 배치) -->
  <g font-size="32" font-weight="700" text-anchor="middle">
    <rect x="780" y="600" width="360" height="72" rx="8" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="3"/>
    <text x="960" y="647" fill="#FFFFFF">Play</text>

    <rect x="780" y="696" width="360" height="72" rx="8" fill="#000000" fill-opacity="0.3" stroke="#9aa4b1" stroke-width="1.5"/>
    <text x="960" y="743" fill="#c9d1db">Controls</text>
    <rect x="780" y="792" width="360" height="72" rx="8" fill="#000000" fill-opacity="0.3" stroke="#9aa4b1" stroke-width="1.5"/>
    <text x="960" y="839" fill="#c9d1db">Quit</text>
  </g>
  <rect width="1920" height="1080" fill="#000000" fill-opacity="0.7"/>

  <!-- 팝업 패널: 안쪽 여백 40px -->
  <rect x="717" y="156" width="486" height="768" rx="8" fill="#2b3036"/>
  <text x="757" y="226" font-size="32" font-weight="700" fill="#FFFFFF">Controls</text>

  <!-- 조작 안내: 제목 아래 24px, 안쪽 여백 24px, 글자 Medium, 키는 굵게, 줄 간격 1.5배, 키와 조작 이름 사이 48px -->
  <rect x="757" y="260" width="406" height="520" rx="8" fill="#000000" fill-opacity="0.45"/>
  <g font-size="24" fill="#FFFFFF">
    <text x="781" y="308" font-weight="700">W, A, S, D</text><text x="964" y="308">이동</text>
    <text x="781" y="348" font-weight="700">마우스 이동</text><text x="964" y="348">시야</text>
    <text x="781" y="388" font-weight="700">좌클릭</text><text x="964" y="388">기본 공격</text>
    <text x="781" y="428" font-weight="700">우클릭</text><text x="964" y="428">가드 / 패리</text>
    <text x="781" y="468" font-weight="700">Left Shift</text><text x="964" y="468">회피 / 달리기</text>
    <text x="781" y="508" font-weight="700">Space</text><text x="964" y="508">점프</text>
    <text x="781" y="548" font-weight="700">1, 2, 3, 4</text><text x="964" y="548">스킬 1, 2, 3, 4</text>
    <text x="781" y="588" font-weight="700">Q</text><text x="964" y="588">궁극기</text>
    <text x="781" y="628" font-weight="700">F</text><text x="964" y="628">처형</text>
    <text x="781" y="668" font-weight="700">R</text><text x="964" y="668">회복병 사용</text>
    <text x="781" y="708" font-weight="700">휠 클릭</text><text x="964" y="708">락온 / 락온 해제</text>
    <text x="781" y="748" font-weight="700">Esc</text><text x="964" y="748">일시정지</text>
  </g>

  <!-- Confirm 버튼: 조작 안내 아래 32px -->
  <rect x="840" y="812" width="240" height="72" rx="8" fill="#354052" stroke="#FFFFFF" stroke-width="3"/>
  <text x="960" y="859" font-size="32" text-anchor="middle" fill="#FFFFFF" font-weight="700">Confirm</text>

  <!-- UI 조작 안내 (참고용, 화면에 표시하지 않음) -->
  <text x="960" y="1000" font-size="20" fill="#9aa4b1" text-anchor="middle">(참고) 닫기: Confirm 버튼, Esc · 팝업 뒤의 타이틀 버튼은 조작할 수 없음</text>
</svg>
