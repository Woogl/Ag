<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4553"/>
      <stop offset="1" stop-color="#2a323d"/>
    </linearGradient>
    <clipPath id="skillSlotInside">
      <circle cx="1661" cy="917" r="38"/>
    </clipPath>
  </defs>

  <!-- 게임 화면 배경 (임시) -->
  <rect width="1920" height="760" fill="url(#sky)"/>
  <rect y="760" width="1920" height="320" fill="#222831"/>
  <path d="M0 760 H1920" stroke="#4a5563" stroke-width="2"/>

  <!-- 화면 여백 48px -->
  <rect x="48" y="48" width="1824" height="984" fill="none" stroke="#9aa4b1" stroke-width="2" stroke-dasharray="12 10" opacity="0.5"/>
  <text x="56" y="34" font-size="16" fill="#9aa4b1">전투 HUD 화면 구성 (기준 해상도 1920 × 1080) · 점선은 화면 여백 48px</text>

  <!-- 월드 참고용 실루엣: 보스 -->
  <g fill="#4b5563">
    <circle cx="960" cy="360" r="30"/>
    <rect x="902" y="396" width="116" height="220" rx="24"/>
    <rect x="912" y="606" width="40" height="150" rx="14"/>
    <rect x="968" y="606" width="40" height="150" rx="14"/>
    <rect x="1022" y="420" width="12" height="280" rx="3" fill="#6b7280" transform="rotate(18 1028 420)"/>
  </g>
  <text x="960" y="790" font-size="16" fill="#7b8696" text-anchor="middle">보스 (월드)</text>

  <!-- 월드 참고용 실루엣: 일반 적 (보스보다 멀리) -->
  <g fill="#4b5563">
    <circle cx="1400" cy="430" r="18"/>
    <rect x="1365" y="452" width="70" height="132" rx="114"/>
    <rect x="1371" y="578" width="26" height="90" rx="109"/>
    <rect x="1403" y="578" width="26" height="90" rx="109"/>
  </g>
  <text x="1400" y="698" font-size="16" fill="#7b8696" text-anchor="middle">일반 적 (월드)</text>

  <!-- 월드 참고용 실루엣: 플레이어 (뒷모습) -->
  <g fill="#3f4753">
    <circle cx="820" cy="660" r="34"/>
    <rect x="756" y="700" width="128" height="200" rx="28"/>
    <rect x="768" y="890" width="46" height="120" rx="16"/>
    <rect x="826" y="890" width="46" height="120" rx="16"/>
  </g>
  <text x="820" y="1050" font-size="16" fill="#7b8696" text-anchor="middle">플레이어 (월드)</text>

  <!-- [3] 보스 상태 -->
  <text x="960" y="78" font-size="32" fill="#FFFFFF" text-anchor="middle">보스 이름</text>
  <rect x="460" y="92" width="1000" height="15" fill="#000000" fill-opacity="0.5"/>
  <rect x="460" y="92" width="620" height="15" fill="#D94545"/>
  <rect x="1080" y="92" width="60" height="15" fill="#FFFFFF" fill-opacity="0.5"/>
  <rect x="460" y="107" width="1000" height="10" fill="#000000" fill-opacity="0.5"/>
  <rect x="460" y="107" width="450" height="10" fill="#FFFFFF"/>
  <rect x="910" y="107" width="40" height="10" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- [4] 락온 마커 -->
  <circle cx="960" cy="470" r="10" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="960" cy="470" r="2" fill="#FFFFFF"/>

  <!-- [5] 상호작용 안내: 락온 마커 오른쪽 가장자리에서 12px, 키 표시 지름 36px, 행동 이름까지 8px -->
  <circle cx="1000" cy="470" r="18" fill="#000000" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="1000" y="478" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">F</text>
  <text x="1026" y="481" font-size="32" fill="#FFFFFF" stroke="#000000" stroke-width="4" paint-order="stroke">처형</text>
  <text x="982" y="512" font-size="14" fill="#9aa4b1">(상호작용 대상이 있을 때)</text>

  <!-- [6] 적 네임플레이트: 머리 위 16px, HP 118 × 9px, PP 118 × 6px -->
  <rect x="1341" y="376" width="118" height="9" fill="#000000" fill-opacity="0.5"/>
  <rect x="1341" y="376" width="70" height="9" fill="#D94545"/>
  <rect x="1411" y="376" width="14" height="9" fill="#FFFFFF" fill-opacity="0.5"/>
  <rect x="1341" y="385" width="118" height="6" fill="#000000" fill-opacity="0.5"/>
  <rect x="1341" y="385" width="84" height="6" fill="#FFFFFF"/>
  <text x="1400" y="362" font-size="14" fill="#9aa4b1" text-anchor="middle">(전투·락온·최근 피해 시)</text>

  <!-- [1] 플레이어 상태: HP / MP -->
  <rect x="48" y="988" width="400" height="15" fill="#000000" fill-opacity="0.5"/>
  <rect x="48" y="988" width="340" height="15" fill="#D94545"/>
  <rect x="388" y="988" width="32" height="15" fill="#FFFFFF" fill-opacity="0.5"/>
  <text x="460" y="998" font-size="24" fill="#FFFFFF">850 / 1000</text>
  <rect x="48" y="1003" width="400" height="10" fill="#000000" fill-opacity="0.5"/>
  <rect x="48" y="1003" width="160" height="10" fill="#3D8BFD"/>
  <text x="460" y="1022" font-size="24" fill="#FFFFFF">40 / 100</text>

  <!-- 회복병: HP 바 12px 위, 지름 80px, 키는 칸 중심에서 오른쪽 45px -->
  <circle cx="88" cy="936" r="40" fill="#000000" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="61" y="909" width="54" height="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="133" cy="936" r="14" fill="#000000" fill-opacity="0.55"/>
  <text x="133" y="943" font-size="18.7" fill="#FFFFFF" text-anchor="middle">R</text>
  <text x="155" y="945" font-size="24" fill="#FFFFFF">2/3</text>

  <!-- [2] 슬롯: 스킬 1~4 십자와 궁극기 (오른쪽 아래), 지름 80px, 십자 가운데 (1736, 917) -->
  <g fill="#000000" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5">
    <circle cx="1661" cy="917" r="40"/>
    <circle cx="1736" cy="842" r="40"/>
    <circle cx="1811" cy="917" r="40"/>
    <circle cx="1736" cy="992" r="40"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 3">
    <rect x="1634" y="890" width="54" height="54"/>
    <rect x="1709" y="815" width="54" height="54"/>
    <rect x="1784" y="890" width="54" height="54"/>
    <rect x="1709" y="965" width="54" height="54"/>
  </g>
  <!-- 쿨다운 표시(스킬 1): 남은 비율만큼 덮개, 경계는 위쪽 가운데부터 시계 방향으로 돎 -->
  <path d="M1661 917 L1696.27 965.54 A60 60 0 1 1 1661 857 Z" fill="#FFFFFF" fill-opacity="0.35" clip-path="url(#skillSlotInside)"/>
  <text x="1661" y="928" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle" stroke="#000000" stroke-width="3" paint-order="stroke">3</text>
  <!-- MP 코스트: 슬롯 중심에서 (29, 29), 어두운 외곽선 -->
  <g font-size="18.7" fill="#FFFFFF" text-anchor="middle" stroke="#000000" stroke-width="3" paint-order="stroke">
    <text x="1690" y="953">20</text>
    <text x="1765" y="878">20</text>
    <text x="1840" y="953">10</text>
    <text x="1765" y="1028">40</text>
  </g>
  <!-- 남은 충전 횟수(스킬 3, 최대 충전 2회 이상): 슬롯 중심에서 (29, -29), MP 코스트와 같은 글자 -->
  <text x="1840" y="895" font-size="18.7" fill="#FFFFFF" text-anchor="middle" stroke="#000000" stroke-width="3" paint-order="stroke">3</text>
  <!-- 키 표시: 십자 가운데에서 30px, 지름 28px -->
  <g fill="#000000" fill-opacity="0.55">
    <circle cx="1706" cy="917" r="14"/>
    <circle cx="1736" cy="887" r="14"/>
    <circle cx="1766" cy="917" r="14"/>
    <circle cx="1736" cy="947" r="14"/>
  </g>
  <g font-size="18.7" fill="#FFFFFF" text-anchor="middle">
    <text x="1706" y="924">1</text>
    <text x="1736" y="894">2</text>
    <text x="1766" y="924">3</text>
    <text x="1736" y="954">4</text>
  </g>
  <!-- 궁극기: 십자 가운데에서 (96, -96), UP 부족으로 흐림, UP 게이지는 그대로 -->
  <g opacity="0.5">
    <circle cx="1832" cy="821" r="40" fill="#000000" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="1805" y="794" width="54" height="54" fill="none" stroke="#9aa4b1" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <path d="M1832 781 A40 40 0 1 1 1808.5 853.4" fill="none" stroke="#A970FF" stroke-width="4" stroke-linecap="round"/>

  <text x="1600" y="960" font-size="14" fill="#9aa4b1" text-anchor="end">스킬 1: 쿨다운 중인 모습</text>
  <text x="1600" y="980" font-size="14" fill="#9aa4b1" text-anchor="end">점선: 아이콘 이미지</text>
  <text x="1600" y="1000" font-size="14" fill="#9aa4b1" text-anchor="end">스킬 3 오른쪽 위: 남은 충전 횟수</text>

  <!-- 번호 표시 -->
  <g font-size="18" font-weight="700" text-anchor="middle" fill="#1b1f24">
    <circle cx="624" cy="996" r="16" fill="#FFD23F"/>
    <text x="624" y="1002">1</text>
    <circle cx="1612" cy="830" r="16" fill="#FFD23F"/>
    <text x="1612" y="836">2</text>
    <circle cx="436" cy="99" r="16" fill="#FFD23F"/>
    <text x="436" y="105">3</text>
    <circle cx="920" cy="450" r="16" fill="#FFD23F"/>
    <text x="920" y="456">4</text>
    <circle cx="1260" cy="470" r="16" fill="#FFD23F"/>
    <text x="1260" y="476">5</text>
    <circle cx="1317" cy="386" r="16" fill="#FFD23F"/>
    <text x="1317" y="392">6</text>
  </g>
</svg>
