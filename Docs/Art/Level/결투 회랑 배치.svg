<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="480" viewBox="0 0 1250 480" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrowFacing" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FFFFFF"/>
    </marker>
  </defs>
  <rect width="1250" height="480" fill="#11151b"/>
  <!-- 1m = 8px. 화면 x = 40 + 8X, 화면 y = 240 - 8Y (오른쪽이 +X, 위쪽이 +Y) -->
  <text x="40" y="40" font-size="24" font-weight="700" fill="#FFFFFF">LV_DuelCorridor · 위에서 본 배치 (오른쪽이 보스 방향)</text>
  <!-- 바닥 -->
  <rect x="40.0" y="220.0" width="160.0" height="40.0" fill="#2f3742"/>  <!-- 시작 통로 -->
  <circle cx="256" cy="240" r="56" fill="#2f3742"/>  <!-- 결투방 1 (원형) -->
  <rect x="308.0" y="220.0" width="64.0" height="40.0" fill="#2f3742"/>  <!-- 통로 1 -->
  <rect x="332.0" y="140.0" width="40.0" height="120.0" fill="#2f3742"/>  <!-- 통로 1 -->
  <rect x="332.0" y="140.0" width="60.0" height="40.0" fill="#2f3742"/>  <!-- 통로 1 -->
  <rect x="392.0" y="96.0" width="128.0" height="128.0" fill="#2f3742"/>  <!-- 결투방 2 -->
  <rect x="372.0" y="188.0" width="20.0" height="36.0" fill="#2f3742"/>  <!-- 엿보기 난간 앞 -->
  <rect x="520.0" y="140.0" width="60.0" height="40.0" fill="#2f3742"/>  <!-- 통로 2 -->
  <rect x="540.0" y="140.0" width="40.0" height="120.0" fill="#2f3742"/>  <!-- 통로 2 -->
  <rect x="540.0" y="220.0" width="60.0" height="40.0" fill="#2f3742"/>  <!-- 통로 2 -->
  <rect x="600.0" y="184.0" width="176.0" height="112.0" fill="#2f3742"/>  <!-- 결투방 3 (길쭉한 방) -->
  <rect x="776.0" y="220.0" width="48.0" height="40.0" fill="#2f3742"/>
  <rect x="824.0" y="200.0" width="80.0" height="80.0" fill="#2f3742"/>
  <rect x="904.0" y="220.0" width="48.0" height="40.0" fill="#2f3742"/>
  <rect x="952.0" y="108.0" width="264.0" height="264.0" fill="#2f3742"/>
  <!-- 샛길 (폭 1.5m) -->
  <rect x="496.0" y="224.0" width="12.0" height="56.0" fill="#2f3742"/>
  <rect x="496.0" y="268.0" width="68.0" height="12.0" fill="#2f3742"/>
  <rect x="552.0" y="260.0" width="12.0" height="8.0" fill="#2f3742"/>
  <!-- 결투방 2의 기둥 (3m × 3m) -->
  <rect x="420.0" y="180.0" width="24.0" height="24.0" fill="#6b7480"/>
  <rect x="420.0" y="116.0" width="24.0" height="24.0" fill="#6b7480"/>
  <!-- 결투방 3의 단상(높이 1.5m)과 경사로 -->
  <rect x="728.0" y="184.0" width="48.0" height="48.0" fill="#4a5563"/>
  <rect x="680.0" y="184.0" width="48.0" height="16.0" fill="#3d4652"/>
  <g font-size="11" fill="#c9d1d9" text-anchor="middle">
    <text x="752" y="245">단상 1.5m</text>
    <text x="704" y="211">경사로</text>
  </g>
  <!-- 엿보기 난간 -->
  <line x1="392.0" y1="224.0" x2="392.0" y2="188.0" stroke="#b48ce0" stroke-width="4"/>
  <g stroke="#b48ce0" stroke-width="1.2" stroke-dasharray="2 4">
    <line x1="382.0" y1="210" x2="480" y2="192"/>
    <line x1="382.0" y1="222" x2="456" y2="128"/>
  </g>
  <!-- 대기 공간에서 커스터가 보이는 방향 -->
  <line x1="848" y1="240" x2="1096" y2="240" stroke="#9aa4b1" stroke-width="1.5" stroke-dasharray="2 5"/>
  <!-- 결투장 아치 (아레나 입구 반대편 벽, 커스터 등 뒤) -->
  <path d="M1188,200.0 L1216,200.0 L1216,280.0 L1188,280.0" fill="none" stroke="#d6b25e" stroke-width="3"/>
  <!-- 구간 이름 -->
  <g font-size="15" fill="#c9d1d9" text-anchor="middle">
    <text x="120" y="208">시작 통로</text>
    <text x="256" y="168">결투방 1</text>
    <text x="484" y="70">결투방 2</text>
    <text x="688" y="168">결투방 3</text>
    <text x="864" y="188">대기 공간</text>
    <text x="1084" y="128">보스 아레나</text>
    <text x="256" y="182" font-size="12" fill="#9aa4b1">지름 14m</text>
    <text x="484" y="86" font-size="12" fill="#9aa4b1">16m × 16m</text>
    <text x="688" y="182" font-size="12" fill="#9aa4b1">22m × 14m</text>
    <text x="1084" y="142" font-size="12" fill="#9aa4b1">33m × 33m</text>
    <text x="352" y="128" font-size="12" fill="#9aa4b1">통로 1</text>
    <text x="560" y="128" font-size="12" fill="#9aa4b1">통로 2</text>
    <text x="1190" y="190" font-size="13" fill="#d6b25e">결투장 아치</text>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="334" y="196" fill="#b48ce0">엿보기 난간</text>
    <text x="528" y="293" fill="#7ed67e">샛길</text>
  </g>
  <!-- 아레나 입구(G)와 중심(C) -->
  <text x="952" y="292" font-size="14" fill="#f5c84c" text-anchor="middle">G</text>
  <circle cx="1084.0" cy="240" r="3" fill="#9aa4b1"/>
  <text x="1084.0" y="262" font-size="14" fill="#9aa4b1" text-anchor="middle">C</text>
  <!-- 바라보는 방향 -->
  <g stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowFacing)">
    <line x1="67.6" y1="240.0" x2="85.2" y2="240.0"/>
    <line x1="299.6" y1="252.0" x2="317.2" y2="252.0"/>
    <line x1="468.4" y1="192.0" x2="450.8" y2="192.0"/>
    <line x1="444.4" y1="128.0" x2="426.8" y2="128.0"/>
    <line x1="560.0" y1="204.4" x2="560.0" y2="186.8"/>
    <line x1="676.4" y1="240.0" x2="658.8" y2="240.0"/>
    <line x1="740.6" y1="210.3" x2="723.4" y2="213.8"/>
    <line x1="1132.4" y1="240.0" x2="1114.8" y2="240.0"/>
  </g>
  <!-- 플레이어와 적 -->
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="56.0" cy="240.0" r="10" fill="#4c9be8"/><text x="56.0" y="244.0">P</text>
    <circle cx="288.0" cy="252.0" r="10" fill="#e5534b"/><text x="288.0" y="256.0">근</text>
    <circle cx="480.0" cy="192.0" r="10" fill="#e5534b"/><text x="480.0" y="196.0">근</text>
    <circle cx="456.0" cy="128.0" r="10" fill="#e5534b"/><text x="456.0" y="132.0">근</text>
    <circle cx="560.0" cy="216.0" r="10" fill="#e5534b"/><text x="560.0" y="220.0">근</text>
    <circle cx="688.0" cy="240.0" r="10" fill="#e5534b"/><text x="688.0" y="244.0">근</text>
    <circle cx="752.0" cy="208.0" r="10" fill="#e08a2e"/><text x="752.0" y="212.0">원</text>
    <circle cx="1148.0" cy="240.0" r="14" fill="#9b6bd6"/><text x="1148.0" y="244.0">B</text>
  </g>
  <text x="572.0" y="230" font-size="11" fill="#c9d1d9">매복</text>
  <!-- 범례와 축척 -->
  <g font-size="12" fill="#c9d1d9">
    <circle cx="48" cy="418" r="6" fill="#4c9be8"/><text x="58" y="422">플레이어 시작 지점</text>
    <circle cx="178" cy="418" r="6" fill="#e5534b"/><text x="188" y="422">근거리 일반 적</text>
    <circle cx="292" cy="418" r="6" fill="#e08a2e"/><text x="302" y="422">원거리 일반 적</text>
    <circle cx="406" cy="418" r="6" fill="#9b6bd6"/><text x="416" y="422">보스 (커스터)</text>
    <line x1="506" y1="418" x2="524" y2="418" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowFacing)"/><text x="530" y="422">바라보는 방향</text>
    <line x1="622" y1="418" x2="642" y2="418" stroke="#b48ce0" stroke-width="4"/><text x="648" y="422">엿보기 난간</text>
    <rect x="42" y="442" width="12" height="12" fill="#2f3742"/><text x="58" y="452">바닥</text>
    <rect x="102" y="442" width="12" height="12" fill="#3d4652"/><text x="118" y="452">경사로</text>
    <rect x="176" y="442" width="12" height="12" fill="#4a5563"/><text x="192" y="452">1.5m</text>
    <rect x="236" y="442" width="12" height="12" fill="#6b7480"/><text x="252" y="452">기둥</text>
    <rect x="296" y="442" width="12" height="12" fill="none" stroke="#d6b25e" stroke-width="2"/><text x="312" y="452">결투장 아치 (높이 약 15m)</text>
  </g>
  <line x1="1016" y1="448" x2="1176" y2="448" stroke="#9aa4b1" stroke-width="2"/>
  <line x1="1016" y1="442" x2="1016" y2="454" stroke="#9aa4b1" stroke-width="2"/>
  <line x1="1176" y1="442" x2="1176" y2="454" stroke="#9aa4b1" stroke-width="2"/>
  <text x="1096" y="438" font-size="12" fill="#9aa4b1" text-anchor="middle">20m</text>
</svg>
