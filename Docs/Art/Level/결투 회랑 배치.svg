<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="450" viewBox="0 0 1240 450" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrowFacing" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <rect width="1240" height="450" fill="#11151b"/>

  <!-- 1m = 8px. 화면 x = 40 + 8X, 화면 y = 240 - 8Y (오른쪽이 +X, 위쪽이 +Y) -->
  <text x="40" y="40" font-size="24" font-weight="700" fill="#FFFFFF">LV_DuelCorridor · 위에서 본 배치 (오른쪽이 보스 방향)</text>

  <!-- 바닥 -->
  <g fill="#2f3742">
    <rect x="40" y="220" width="160" height="40"/>   <!-- 시작 통로 -->
    <rect x="200" y="184" width="112" height="112"/> <!-- 결투방 1 -->
    <rect x="312" y="220" width="60" height="40"/>   <!-- 통로 1 -->
    <rect x="332" y="140" width="40" height="120"/>
    <rect x="332" y="140" width="60" height="40"/>
    <rect x="392" y="96" width="128" height="128"/>  <!-- 결투방 2 -->
    <rect x="520" y="140" width="60" height="40"/>   <!-- 통로 2 -->
    <rect x="540" y="140" width="40" height="120"/>
    <rect x="540" y="220" width="60" height="40"/>
    <rect x="600" y="168" width="144" height="144"/> <!-- 결투방 3 -->
    <rect x="744" y="220" width="48" height="40"/>   <!-- 통로 3 -->
    <rect x="792" y="200" width="80" height="80"/>   <!-- 대기 공간 -->
    <rect x="872" y="220" width="48" height="40"/>   <!-- 통로 4 -->
    <rect x="920" y="108" width="264" height="264"/> <!-- 보스 아레나 -->
  </g>

  <!-- 2차 웨이브 대기실 (4m × 3.5m) -->
  <g fill="#252b34">
    <rect x="400" y="68" width="32" height="28"/>   <!-- 결투방 2 북쪽 -->
    <rect x="400" y="224" width="32" height="28"/>  <!-- 결투방 2 남쪽 -->
    <rect x="632" y="312" width="32" height="28"/>  <!-- 결투방 3 남쪽 -->
  </g>

  <!-- 결투방 2의 기둥 (2m × 2m) -->
  <g fill="#6b7480">
    <rect x="424" y="180" width="16" height="16"/>
    <rect x="424" y="124" width="16" height="16"/>
  </g>

  <!-- 결투방 3의 단상(높이 1.5m)과 경사로 -->
  <rect x="696" y="168" width="48" height="48" fill="#4a5563"/>
  <rect x="648" y="168" width="48" height="16" fill="#3d4652"/>
  <g font-size="11" fill="#c9d1d9" text-anchor="middle">
    <text x="720" y="228">단상 1.5m</text>
    <text x="672" y="180">경사로</text>
  </g>

  <!-- 결투방 1의 정찰 경로 -->
  <line x1="232" y1="252" x2="288" y2="252" stroke="#e5534b" stroke-width="1.5" stroke-dasharray="3 4"/>
  <g fill="#e5534b">
    <rect x="228" y="248" width="8" height="8" transform="rotate(45 232 252)"/>
    <rect x="284" y="248" width="8" height="8" transform="rotate(45 288 252)"/>
  </g>
  <text x="260" y="272" font-size="11" fill="#c9d1d9" text-anchor="middle">정찰</text>

  <!-- 대기 공간에서 커스터가 보이는 방향 -->
  <line x1="850" y1="240" x2="1098" y2="240" stroke="#9aa4b1" stroke-width="1.5" stroke-dasharray="2 5"/>

  <!-- 잠기는 출입구 -->
  <g stroke="#f0a04b" stroke-width="3" stroke-dasharray="5 4">
    <line x1="200" y1="220" x2="200" y2="260"/>
    <line x1="312" y1="220" x2="312" y2="260"/>
    <line x1="392" y1="140" x2="392" y2="180"/>
    <line x1="520" y1="140" x2="520" y2="180"/>
    <line x1="600" y1="220" x2="600" y2="260"/>
    <line x1="744" y1="220" x2="744" y2="260"/>
    <line x1="920" y1="220" x2="920" y2="260"/>
  </g>

  <!-- 2차 웨이브 문 -->
  <g stroke="#5fc4d6" stroke-width="3" stroke-dasharray="5 4">
    <line x1="400" y1="96" x2="432" y2="96"/>
    <line x1="400" y1="224" x2="432" y2="224"/>
    <line x1="632" y1="312" x2="664" y2="312"/>
  </g>

  <!-- 구간 이름 -->
  <g font-size="15" fill="#c9d1d9" text-anchor="middle">
    <text x="120" y="212">시작 통로</text>
    <text x="256" y="204">결투방 1</text>
    <text x="256" y="222" font-size="12" fill="#9aa4b1">14m × 14m</text>
    <text x="476" y="116">결투방 2</text>
    <text x="476" y="134" font-size="12" fill="#9aa4b1">16m × 16m</text>
    <text x="636" y="210">결투방 3</text>
    <text x="636" y="228" font-size="12" fill="#9aa4b1">18m × 18m</text>
    <text x="832" y="192">대기 공간</text>
    <text x="1052" y="132">보스 아레나</text>
    <text x="1052" y="150" font-size="12" fill="#9aa4b1">33m × 33m</text>
    <text x="352" y="132" font-size="12" fill="#9aa4b1">통로 1</text>
    <text x="560" y="132" font-size="12" fill="#9aa4b1">통로 2</text>
  </g>
  <g font-size="11" fill="#5fc4d6">
    <text x="438" y="78">2차</text>
    <text x="438" y="246">2차</text>
    <text x="670" y="332">2차</text>
  </g>

  <!-- 아레나 입구(G)와 중심(C) -->
  <text x="920" y="282" font-size="14" fill="#f5c84c" text-anchor="middle">G</text>
  <circle cx="1052" cy="240" r="3" fill="#9aa4b1"/>
  <text x="1052" y="262" font-size="14" fill="#9aa4b1" text-anchor="middle">C</text>

  <!-- 바라보는 방향 -->
  <g stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowFacing)">
    <line x1="66" y1="240" x2="86" y2="240"/>
    <line x1="298" y1="240" x2="314" y2="240"/>
    <line x1="470" y1="192" x2="452" y2="194"/>
    <line x1="470" y1="128" x2="452" y2="126"/>
    <line x1="416" y1="92" x2="416" y2="108"/>
    <line x1="416" y1="228" x2="416" y2="212"/>
    <line x1="560" y1="206" x2="560" y2="188"/>
    <line x1="660" y1="240" x2="642" y2="240"/>
    <line x1="710" y1="196" x2="693" y2="203"/>
    <line x1="648" y1="316" x2="648" y2="300"/>
    <line x1="1102" y1="240" x2="1080" y2="240"/>
  </g>

  <!-- 플레이어와 적 -->
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="56" cy="240" r="10" fill="#4c9be8"/><text x="56" y="244">P</text>
    <circle cx="288" cy="240" r="10" fill="#e5534b"/><text x="288" y="244">근</text>
    <circle cx="480" cy="192" r="10" fill="#e5534b"/><text x="480" y="196">근</text>
    <circle cx="480" cy="128" r="10" fill="#e5534b"/><text x="480" y="132">근</text>
    <circle cx="416" cy="82" r="9" fill="#e5534b"/><text x="416" y="86">근</text>
    <circle cx="416" cy="238" r="9" fill="#e08a2e"/><text x="416" y="242">원</text>
    <circle cx="560" cy="216" r="10" fill="#e5534b"/><text x="560" y="220">근</text>
    <circle cx="672" cy="240" r="10" fill="#e5534b"/><text x="672" y="244">근</text>
    <circle cx="720" cy="192" r="10" fill="#e08a2e"/><text x="720" y="196">원</text>
    <circle cx="648" cy="326" r="9" fill="#e5534b"/><text x="648" y="330">근</text>
    <circle cx="1116" cy="240" r="14" fill="#9b6bd6"/><text x="1116" y="244">B</text>
  </g>
  <text x="586" y="220" font-size="11" fill="#c9d1d9">매복</text>

  <!-- 범례와 축척 -->
  <g font-size="13" fill="#c9d1d9">
    <circle cx="48" cy="412" r="7" fill="#4c9be8"/><text x="60" y="417">플레이어 시작 지점</text>
    <circle cx="188" cy="412" r="7" fill="#e5534b"/><text x="200" y="417">근거리 일반 적</text>
    <circle cx="318" cy="412" r="7" fill="#e08a2e"/><text x="330" y="417">원거리 일반 적</text>
    <circle cx="448" cy="412" r="7" fill="#9b6bd6"/><text x="460" y="417">보스 (커스터)</text>
    <line x1="562" y1="412" x2="582" y2="412" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrowFacing)"/><text x="590" y="417">바라보는 방향</text>
    <line x1="690" y1="412" x2="710" y2="412" stroke="#f0a04b" stroke-width="3" stroke-dasharray="5 4"/><text x="718" y="417">잠기는 출입구</text>
    <line x1="818" y1="412" x2="838" y2="412" stroke="#5fc4d6" stroke-width="3" stroke-dasharray="5 4"/><text x="846" y="417">2차 웨이브 문</text>
  </g>
  <line x1="1024" y1="412" x2="1184" y2="412" stroke="#9aa4b1" stroke-width="2"/>
  <line x1="1024" y1="406" x2="1024" y2="418" stroke="#9aa4b1" stroke-width="2"/>
  <line x1="1184" y1="406" x2="1184" y2="418" stroke="#9aa4b1" stroke-width="2"/>
  <text x="1104" y="404" font-size="13" fill="#9aa4b1" text-anchor="middle">20m</text>
</svg>
