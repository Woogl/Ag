<text x="24" y="34" font-size="21" font-weight="700" fill="#FFFFFF">요새 돌파 · 옆에서 본 높이 단면</text>
<text x="24" y="58" font-size="13" fill="#8794a5">12m 높이의 시작 지점에서 내려와 평지를 지나고, 언덕길로 성문 앞까지 올라갑니다. 세로를 가로보다 3배 늘려 그렸습니다.</text>
